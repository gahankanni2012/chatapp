<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient matching user's logo -->
    <linearGradient id="squircleGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#b855f6" />
      <stop offset="25%" stop-color="#9333ea" />
      <stop offset="65%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Subtle Top Lighting Highlight -->
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#5e17eb" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Ambient Glow & Base Squircle matching user logo -->
  <g filter="url(#shadow)">
    <rect
      x="40"
      y="40"
      width="432"
      height="432"
      rx="118"
      ry="118"
      fill="url(#squircleGrad)"
    />
    <!-- Subtle Inner Border Highlight -->
    <rect
      x="41"
      y="41"
      width="430"
      height="430"
      rx="117"
      ry="117"
      fill="url(#innerGlow)"
      stroke="rgba(255, 255, 255, 0.25)"
      stroke-width="3"
    />
  </g>
</svg>
